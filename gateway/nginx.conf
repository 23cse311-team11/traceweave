events {
    worker_connections 1024;
}

http {
    # -----------------------------
    # Upstream Services
    # -----------------------------
    upstream core_api {
        server core-api:4000;
    }

    upstream ai_service {
        server ai-service:5000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # -----------------------------
    # 1. HTTP Server (Port 80)
    # ACME Challenge + Domain Redirects + Direct IP fallback
    # -----------------------------
    server {
        listen 80 default_server;
        server_name app.traceweavesupply.tech api.traceweavesupply.tech traceweavesupply.tech localhost _;

        # ACME challenge for Let's Encrypt validation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Dedicated version ping
        location = /version {
            default_type application/json;
            return 200 '{"status":"operational","release":"v1.0.1","service":"traceweave-cloud"}\n';
        }

        # Dedicated health ping
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"active","version":"1.0.1"}\n';
        }

        # If accessed via configured domain, redirect to HTTPS
        if ($host ~* ^(app\.|api\.)?traceweavesupply\.tech$) {
            return 301 https://$host$request_uri;
        }

        # Fallback for direct IP / local access: route traffic directly
        location /api/v1/analyze {
            proxy_pass http://ai_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location /api/ {
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }

    # -----------------------------
    # 2. HTTPS - app.traceweavesupply.tech & Default SSL
    # -----------------------------
    server {
        listen 443 ssl default_server;
        server_name app.traceweavesupply.tech;

        # SSL certificate paths (Let's Encrypt / Bootstrap)
        ssl_certificate /etc/letsencrypt/live/app.traceweavesupply.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.traceweavesupply.tech/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location = /version {
            default_type application/json;
            return 200 '{"status":"operational","release":"v1.0.1","service":"traceweave-cloud"}\n';
        }

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"active","version":"1.0.1"}\n';
        }

        # AI Service
        location /api/v1/analyze {
            proxy_pass http://ai_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Core API
        location /api/ {
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 3600s;
        }

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }
    }

    # -----------------------------
    # 3. HTTPS - api.traceweavesupply.tech (Dedicated Core API Subdomain)
    # -----------------------------
    server {
        listen 443 ssl;
        server_name api.traceweavesupply.tech;

        ssl_certificate /etc/letsencrypt/live/app.traceweavesupply.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.traceweavesupply.tech/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location = /version {
            default_type application/json;
            return 200 '{"status":"operational","release":"v1.0.1","service":"traceweave-api"}\n';
        }

        location = /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"active","version":"1.0.1"}\n';
        }

        location /api/v1/analyze {
            proxy_pass http://ai_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Route all other API requests directly to core_api
        location / {
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_read_timeout 3600s;
        }
    }

    # -----------------------------
    # 4. HTTPS - traceweavesupply.tech (Apex Domain Redirect to app)
    # -----------------------------
    server {
        listen 443 ssl;
        server_name traceweavesupply.tech;

        ssl_certificate /etc/letsencrypt/live/app.traceweavesupply.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.traceweavesupply.tech/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        return 301 https://app.traceweavesupply.tech$request_uri;
    }
}
